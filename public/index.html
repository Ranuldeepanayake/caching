<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Lab</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><p class="eyebrow">POSTGRESQL + REDIS / ELASTICACHE</p><h1>Cache Lab</h1><p>Compare the same multi-join ecommerce query with caching on and off.</p></header><section class="controls"><label>Search <input id="query" placeholder="e.g. keyboard"></label><label>Category <input id="category" placeholder="electronics"></label><label class="toggle"><input id="cache" type="checkbox" checked> Enable cache</label><button id="run">Run query</button></section><section id="status" class="status">Ready.</section><section id="results" class="grid"></section></main><script src="/app.js"></script></body></html>
